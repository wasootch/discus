name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set version from tag
        run: mvn -B versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $GITHUB_REF_NAME target/discus-*.jar --title "discus $GITHUB_REF_NAME" --generate-notes
